[package]
name = "akita-metal"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Prover-only Metal commitment kernels for Akita"
repository = "https://github.com/LayerZero-Labs/akita"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
akita-algebra = { version = "0.1.0", path = "../akita-algebra" }
akita-error = { version = "0.1.0", path = "../akita-error" }
bytemuck = { version = "1.16", features = ["derive"] }
jolt-field = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "550d60770b49d4e154c4f8f32c7810a441a45899", default-features = false, features = [
  "bytemuck",
  "solinas",
] }
# Direct source production requires the typed uninit/write_uninit/assume_init
# runtime at this revision; all Jolt pins stay aligned for shared field identity.
jolt-metal = { version = "=0.1.0", git = "https://github.com/a16z/jolt", rev = "550d60770b49d4e154c4f8f32c7810a441a45899" }
rayon = { version = "1.10", optional = true }
thiserror = "2.0"
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
akita-cpu-backend = { version = "0.1.0", path = "../akita-cpu-backend", default-features = false, features = ["transcript-blake2b"] }
akita-params = { version = "0.1.0", path = "../akita-params", default-features = false }
akita-types = { version = "0.1.0", path = "../akita-types", default-features = false }
